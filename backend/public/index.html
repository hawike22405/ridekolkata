<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ride Kolkata • Admin</title><link rel="stylesheet" href="style.css"><script src="admin.js" defer></script></head><body><main><header><p>RIDE KOLKATA</p><h1>Operations console</h1><p>Manage the routes and fares your riders see.</p></header><section id="login"><h2>Admin sign in</h2><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required></label><button>Sign in</button></form></section><section id="console" hidden><nav><button id="routes">Routes</button><button id="pricing">Pricing</button><button id="refresh">Refresh</button><button id="logout">Sign out everywhere</button></nav><h2 id="heading">Routes</h2><p id="pageLabel"></p><div id="records"></div><nav><button id="previous">Previous page</button><button id="next">Next page</button><button id="new">New record</button></nav><h2 id="editorHeading">Create record</h2><p id="fields"></p><p>Submit every field as JSON. Coordinates use [longitude, latitude]. Prices are integer paise. No fields are automatically filled.</p><form id="editForm"><label>Record JSON<textarea id="json" rows="16" required spellcheck="false"></textarea></label><button id="save">Create</button><button id="delete" type="button" hidden>Delete record</button></form></section><p id="status" role="status" aria-live="polite"></p></main></body></html>
